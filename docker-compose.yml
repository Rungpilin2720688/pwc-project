services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once: applies migrations and seeds 25k products (skipped if data already exists).
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://catalog:catalog@db:5432/catalog?schema=public
      SEED_PRODUCT_COUNT: ${SEED_PRODUCT_COUNT:-25000}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://catalog:catalog@db:5432/catalog?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
